services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  python-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    ports:
      - '8917:8917'
    # Em dev: monta o código para hot-reload sem rebuild de imagem.
    # Em produção (Oracle): remover este volume — a imagem já contém o código.
    volumes:
      - ./worker:/app
    env_file:
      - .env
      - ./worker/.env.worker
    command: >
      sh -c "python -c 'import cryptography' 2>/dev/null || pip install --no-cache-dir -r requirements.txt;
      arq queue_worker.WorkerSettings &
      uvicorn main:app --host 0.0.0.0 --port $${WORKER_PORT:-8917} --workers $${WORKERS:-1}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8917/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
