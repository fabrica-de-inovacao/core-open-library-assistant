services:
  python-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - ./worker:/app
    environment:
      - WORKER_API_KEY=sk_worker_6f8a9d2b4c1e3f5a7d9c0e2b4f6a8c0d2e4f6a8c0d2e4f6a8c0d2e4f6a8c0d2
      # GPU flags — usados apenas se o nvidia-container-toolkit estiver disponível.
      # O worker detecta GPU/CPU automaticamente via ONNX Runtime (graceful fallback).
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # Para habilitar GPU explicitamente (requer nvidia-container-toolkit no host):
    # docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d python-worker
