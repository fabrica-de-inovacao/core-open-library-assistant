# docker-compose.coolify.yml
#
# Stack Coolify v4 para a aplicação e o worker Python.
# Postgres e Redis ficam como resources separados do Coolify e entram via env:
#   DATABASE_URL=<internal postgres url>
#   REDIS_URL=<internal redis url>
#
# Expor publicamente:
#   app           -> porta 3000 -> https://core.seudominio.com
#   python-worker -> porta 8000 -> https://worker.seudominio.com
#
# O app deve chamar o worker pela rede interna Docker, não pelo domínio público:
#   PYTHON_WORKER_URL=http://python-worker:8000

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_URL: ${AUTH_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      USER_SECRET_ENCRYPTION_KEY: ${USER_SECRET_ENCRYPTION_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      PYTHON_WORKER_URL: http://python-worker:8000
      WORKER_API_KEY: ${WORKER_API_KEY}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_MODEL_ORCHESTRATOR: ${LLM_MODEL_ORCHESTRATOR:-}
      LLM_MODEL_SYNTHESIS: ${LLM_MODEL_SYNTHESIS:-gpt-4o-mini}
      LLM_MODEL_STRATEGY: ${LLM_MODEL_STRATEGY:-gpt-4o-mini}
      LLM_MODEL_RERANKER: ${LLM_MODEL_RERANKER:-gpt-4o-mini}
      LLM_MODEL_TLDR: ${LLM_MODEL_TLDR:-gpt-4o-mini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      LOG_MODE: production
    depends_on:
      python-worker:
        condition: service_healthy
    restart: unless-stopped

  python-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      USER_SECRET_ENCRYPTION_KEY: ${USER_SECRET_ENCRYPTION_KEY}
      ENABLE_ARQ_WORKER: '1'
      WORKER_API_KEY: ${WORKER_API_KEY}
      PYTHON_WORKER_URL: http://127.0.0.1:8000
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL_TLDR: ${LLM_MODEL_TLDR:-gpt-4o-mini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      WORKERS: ${EXTRACTION_UVICORN_WORKERS:-2}
      EXTRACTION_WORKERS: ${EXTRACTION_WORKERS:-}
      MAX_CONCURRENT_EXTRACTIONS: ${MAX_CONCURRENT_EXTRACTIONS:-}
      OCR_PAGE_CHUNK_SIZE: ${OCR_PAGE_CHUNK_SIZE:-10}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
